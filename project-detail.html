<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Project Detail - Nguyen Van Anh</title>

  <meta
    name="description"
    content="Project detail by Nguyen Van Anh - Backend Engineer specializing in Java, Spring Boot, and scalable systems.">

  <meta name="theme-color" content="#EFF1F5">
  <meta property="og:title" content="Project Detail - Nguyen Van Anh">
  <meta property="og:description" content="Engineering project detail by Nguyen Van Anh.">
  <meta property="og:type" content="article">
  <meta property="og:image" content="https://iamnvanh205.github.io/portfolio/assets/images/avatar/avatar.jpg">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto+Serif:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap">

  <link rel="icon" sizes="512x512" href="./assets/images/favicon/favicon-32.png">

  <link rel="stylesheet" href="./css/main.css">

</head>

<body class="project-detail-page">

  <a id="skip-link" class="skip-link" href="#project-detail-main">
    Skip to content
  </a>

  <div class="project-detail-topbar">
    <div class="project-detail-topbar__inner page-container">

      <a href="./index.html#projects" class="project-detail-back">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16" height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
        <span id="project-detail-back-label">Back to Portfolio</span>
      </a>

      <div class="project-detail-controls">
        <div
          class="theme-toggle"
          role="group"
          aria-label="Color theme">
          <button
            class="theme-toggle__option btn-text"
            data-theme-option="light">
            Light
          </button>
          <button
            class="theme-toggle__option btn-text"
            data-theme-option="dark">
            Dark
          </button>
        </div>

        <div
          class="lang-toggle"
          role="group"
          aria-label="Language">
          <button
            class="lang-toggle__option btn-text active"
            data-lang-option="en"
            aria-pressed="true">
            EN
          </button>
          <button
            class="lang-toggle__option btn-text"
            data-lang-option="vi"
            aria-pressed="false">
            VI
          </button>
        </div>
      </div>

    </div>
  </div>

  <main id="project-detail-main" class="project-detail-main" tabindex="-1" role="main">
    <div id="project-detail" class="page-container"></div>
  </main>

  <footer class="footer" role="contentinfo">
    <div class="footer__container page-container">
      <p class="footer__text footer-text">
        &copy; <span id="footer-year"></span> Nguyen Van Anh. All rights reserved.
      </p>
    </div>
  </footer>

  <script type="module">
    import { initTheme, toggleTheme, updateThemeButtons } from "./js/modules/theme.js";
    import { getProjects, initLang, setLang, t, updateLangButtons } from "./js/modules/lang.js";

    const detail = document.getElementById("project-detail");
    const params = new URLSearchParams(window.location.search);

    initLang();
    initTheme();

    document.getElementById("footer-year").textContent = new Date().getFullYear();

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-theme-option]");
      if (btn) toggleTheme(btn.dataset.themeOption);
    });

    document.addEventListener("click", (event) => {
      const btn = event.target.closest("[data-lang-option]");
      if (!btn) return;

      setLang(btn.dataset.langOption);
      renderPage();
    });

    function renderPage() {
      const project = getProjects().find((item) => item.id === params.get("id"));

      document.querySelector("#skip-link").textContent = t("skipToContent");
      document.querySelector("#project-detail-back-label").textContent = t("projectsPage.back");
      document.querySelector("[data-theme-option='light']").textContent = t("light");
      document.querySelector("[data-theme-option='dark']").textContent = t("dark");
      document.querySelector("[data-theme-option='light']").parentElement.setAttribute("aria-label", t("themeLabel"));
      document.querySelector("[data-lang-option='en']").parentElement.setAttribute("aria-label", t("languageLabel"));
      document.querySelector(".footer-text").lastChild.textContent = ` Nguyen Van Anh. ${t("footer")}`;

      if (!project) {
        document.title = `${t("projectsPage.notFound")} - Nguyen Van Anh`;
        detail.innerHTML = `
          <div class="project-detail-empty">
            <h1 class="section-title">${t("projectsPage.notFound")}</h1>
            <a href="./index.html#projects" class="btn btn-outline">${t("projectsPage.back")}</a>
          </div>
        `;
        updateThemeButtons();
        updateLangButtons();
        return;
      }

      document.title = `${project.title} - Nguyen Van Anh`;
      document.querySelector('meta[property="og:title"]').content = document.title;
      document.querySelector('meta[property="og:description"]').content = project.description;
      document.querySelector('meta[property="og:image"]').content =
        new URL(project.thumbnail, window.location.href).href;
      detail.innerHTML = renderProject(project);
      updateThemeButtons();
      updateLangButtons();
    }

    function renderProject(project) {
      const summary = project.description
        ? `<p class="project-detail-card__summary body-small">${project.description}</p>`
        : "";

      const docsItem = project.docs
        ? `<li>${t("projectsPage.docsPrefix")} <a class="project-detail-card__docs-link" href="${project.docs}" target="_blank" rel="noopener noreferrer">${t("projectsPage.docsLink")}</a>.</li>`
        : "";

      const body = (project.highlights && project.highlights.length)
        ? project.highlights
            .map((section) => `
              <section class="project-detail-card__section">
                <h2 class="project-detail-card__section-title">${section.heading}</h2>
                <ul class="project-detail-card__description body-small">
                  ${section.bullets.map((bullet) => `<li>${bullet}</li>`).join("")}
                </ul>
              </section>
            `)
            .join("") + (docsItem ? `<ul class="project-detail-card__description body-small">${docsItem}</ul>` : "")
        : `<ul class="project-detail-card__description body-small">
            ${(project.description.match(/[^.!?]+[.!?]?/g) || [project.description])
              .map((line) => `<li>${line.trim()}</li>`)
              .join("")}
            ${docsItem}
          </ul>`;

      const gallery = project.screenshots?.length
        ? `
          <div class="project-detail-gallery" aria-label="${t("projectsPage.galleryLabel")}">
            ${project.screenshots
              .slice(0, 4)
              .map((src, i) => `
                <img
                  class="project-detail-gallery__item"
                  src="${src}"
                  alt="${project.title} - ${t("projectsPage.interfacePreview")} ${i + 1}"
                  loading="lazy"
                  decoding="async">
              `)
              .join("")}
          </div>
        `
        : "";

      return `
        <article class="project-detail-card" aria-label="${project.title}">
          <header class="project-detail-card__header">
            <div class="project-detail-card__meta body-small">
              ${project.featured ? `<span class="project-detail-card__featured">${t("projectsPage.featured")}</span>` : ""}
              ${project.duration ? `<span>${project.duration.replaceAll("[", "").replaceAll("]", "")}</span>` : ""}
            </div>
            <h1 class="section-title">${project.title}</h1>
          </header>

          <div class="project-detail-card__tags">
            ${project.tags.map((tag) => `<span class="tech-tag">${tag}</span>`).join("")}
          </div>

          <div class="project-detail-card__actions">
            ${project.demo ? `<a href="${project.demo}" target="_blank" rel="noopener noreferrer" class="btn btn-primary">${t("projectsPage.demo")}</a>` : ""}
            ${project.github ? `<a href="${project.github}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">${t("projectsPage.code")}</a>` : ""}
            ${project.docs ? `<a href="${project.docs}" target="_blank" rel="noopener noreferrer" class="btn btn-outline">${t("projectsPage.docs")}</a>` : ""}
          </div>

          ${summary}

          <div class="project-detail-card__body">
            ${body}
          </div>

          ${gallery}
        </article>
      `;
    }

    renderPage();
  </script>

</body>
</html>
